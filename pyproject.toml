[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "master-arsenal-binance-engine"
version = "0.3.0"
description = "MASTER ARSENAL Binance data engine and local job runtime"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ma-binance = "binance_data_engine.cli:main"
ma-local = "local_engine.cli:main"

[tool.setuptools.packages.find]
include = ["binance_data_engine*", "local_engine*"]
