name: Windows packaging prototype

on:
  push:
    branches: [develop]
    paths:
      - "binance_data_engine/**"
      - "local_engine/**"
      - "report_engine/**"
      - "packaging/windows/**"
      - "pyproject.toml"
      - ".github/workflows/windows-package.yml"
  pull_request:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: windows-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Package and smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Build self-contained application folders
        shell: pwsh
        run: .\packaging\windows\build.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Compile single-download installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\installer | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "packaging\windows\MASTER-ARSENAL.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }

      - name: Install and verify packaged application
        shell: pwsh
        run: |
          $Installer = Get-ChildItem dist\installer\*.exe | Select-Object -First 1
          if (-not $Installer) { throw "Installer artifact was not created." }
          $InstallDir = Join-Path $env:TEMP "MASTER-ARSENAL-package-smoke"
          if (Test-Path $InstallDir) { Remove-Item $InstallDir -Recurse -Force }
          $InstallProcess = Start-Process -FilePath $Installer.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$InstallDir" -Wait -PassThru
          if ($InstallProcess.ExitCode -ne 0) { throw "Silent installation failed with exit code $($InstallProcess.ExitCode)." }
          $LocalExe = Join-Path $InstallDir "ma-local\ma-local.exe"
          $BinanceExe = Join-Path $InstallDir "ma-binance\ma-binance.exe"
          if (-not (Test-Path $LocalExe) -or -not (Test-Path $BinanceExe)) { throw "Installed executables are missing." }
          $InstalledManifestPath = Join-Path $InstallDir "release-manifest.json"
          if (-not (Test-Path $InstalledManifestPath)) { throw "Installed release manifest is missing." }
          if (-not (Test-Path (Join-Path $InstallDir "runtime-lock.txt"))) { throw "Installed runtime inventory is missing." }
          $InstalledManifest = Get-Content $InstalledManifestPath -Raw | ConvertFrom-Json
          foreach ($Record in $InstalledManifest.files) {
            $PayloadPath = Join-Path $InstallDir ($Record.path.Replace("/", "\\"))
            if (-not (Test-Path $PayloadPath)) { throw "Installed payload file is missing: $($Record.path)" }
            $ActualHash = (Get-FileHash $PayloadPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($ActualHash -ne $Record.sha256) { throw "Installed payload integrity mismatch: $($Record.path)" }
          }
          $OriginalPath = $env:PATH
          $OriginalPythonHome = $env:PYTHONHOME
          $OriginalPythonPath = $env:PYTHONPATH
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:PYTHONHOME -ErrorAction SilentlyContinue
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          & $LocalExe --help
          if ($LASTEXITCODE -ne 0) { throw "Installed Local Engine help failed without Python/Java on PATH." }
          & $BinanceExe --help
          if ($LASTEXITCODE -ne 0) { throw "Installed Binance help failed without Python/Java on PATH." }
          & $LocalExe init
          if ($LASTEXITCODE -ne 0) { throw "Installed default workspace initialization failed without Python/Java on PATH." }
          $env:PATH = $OriginalPath
          if ($null -ne $OriginalPythonHome) { $env:PYTHONHOME = $OriginalPythonHome }
          if ($null -ne $OriginalPythonPath) { $env:PYTHONPATH = $OriginalPythonPath }
          $PersistentWorkspace = Join-Path $env:LOCALAPPDATA "MASTER-ARSENAL\workspace"
          if (-not (Test-Path (Join-Path $PersistentWorkspace "jobs\inbox"))) { throw "Persistent workspace was not initialized." }
          $Uninstaller = Join-Path $InstallDir "unins000.exe"
          if (-not (Test-Path $Uninstaller)) { throw "Inno Setup uninstaller is missing." }
          $UninstallLog = Join-Path $env:TEMP "MASTER-ARSENAL-uninstall.log"
          $UninstallProcess = Start-Process -FilePath $Uninstaller -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=$UninstallLog" -Wait -PassThru
          if ($UninstallProcess.ExitCode -ne 0) { Get-Content $UninstallLog; throw "Silent uninstall failed with exit code $($UninstallProcess.ExitCode)." }
          Start-Sleep -Seconds 2
          if (Test-Path $LocalExe) { Get-Content $UninstallLog; throw "Uninstall left the Local Engine executable behind." }
          if (Test-Path $BinanceExe) { Get-Content $UninstallLog; throw "Uninstall left the Binance executable behind." }
          if (-not (Test-Path (Join-Path $PersistentWorkspace "jobs\inbox"))) { throw "Uninstall removed persistent user data." }

      - name: Generate installer SHA-256 manifest
        shell: pwsh
        run: |
          $Installer = Get-ChildItem dist\installer\*.exe | Select-Object -First 1
          $Hash = (Get-FileHash $Installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "{"
            '  "artifact": "' + $Installer.Name + '",'
            '  "sha256": "' + $Hash + '",'
            '  "runner": "' + '${{ matrix.os }}' + '",'
            '  "python": "3.11",'
            '  "packaging": "PyInstaller 6.11.1 + Inno Setup 6"'
            "}"
          ) | Set-Content dist\installer\SHA256-manifest.json -Encoding utf8

      - name: Upload Windows installer prototype
        uses: actions/upload-artifact@v4
        with:
          name: MASTER-ARSENAL-Windows-${{ matrix.os }}
          path: dist/installer/*
          if-no-files-found: error
          retention-days: 14
