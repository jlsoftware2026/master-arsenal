name: Binance live smoke test

on:
  push:
    branches:
      - feature/bootstrap-project-structure
  workflow_dispatch:
    inputs:
      market:
        description: Market to test
        required: true
        type: choice
        options:
          - both
          - spot
          - usdm
        default: both

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Test live public Binance endpoints
        run: python scripts/live_smoke.py --market "${{ inputs.market || 'both' }}"
