name: Python tests

on:
  push:
    branches: [main, develop, feature/local-engine-phase-2-foundation]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: python -m pip install -e .
      - name: Run Binance data engine unit tests
        run: python -m unittest discover -s binance_data_engine/tests -v
      - name: Run Local Engine unit tests
        run: python -m unittest discover -s local_engine/tests -p 'test_local_engine.py' -v
